# Publică site-ul pe GitHub Pages după modificări de cod (nu după actualizările de date,
# acelea sunt publicate de „AziNews Update"). Se poate porni și manual.
name: AziNews Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'data/**'
      - 'feed.xml'
      - 'all_news.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000

      # GitHub Pages blochează uneori publicarea („deployment_queued” sau API indisponibil);
      # o a doua încercare rezolvă de obicei, iar workflow-ul pică doar dacă și ea eșuează.
      - name: Reîncearcă publicarea
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          timeout: 420000
