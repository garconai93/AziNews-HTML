# Publică site-ul pe GitHub Pages după modificări de cod (nu după actualizările de date,
# acelea sunt publicate de „AziNews Update"). Se poate porni și manual.
name: AziNews Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'data/**'
      - 'feed.xml'
      - 'all_news.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
